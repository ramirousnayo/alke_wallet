<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} — Alke Wallet</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        form { margin-top: 20px; }
        label { display: block; font-weight: bold; margin-top: 14px; color: #555; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .errorlist { color: #e74c3c; font-size: 0.85em; margin: 4px 0; padding: 0; list-style: none; }
        .btn-submit { margin-top: 20px; background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .btn-submit:hover { background: #219a52; }
        .btn-back { color: #2980b9; text-decoration: none; display: inline-block; margin-top: 10px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 14px; color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <a href="/">👤 Usuarios</a>
        <a href="{% url 'transaccion_list' %}">💳 Transacciones</a>
    </nav>
    <h1>{{ titulo }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <ul class="errorlist">
                    {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                </ul>
            {% endif %}
        {% endfor %}
        <button type="submit" class="btn-submit">Guardar</button>
    </form>
    <a href="{% url 'transaccion_list' %}" class="btn-back">← Cancelar</a>
</body>
</html>
