<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Transacción — Alke Wallet</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #c0392b; }
        .warning-box { background: #fdecea; border: 1px solid #e74c3c; border-radius: 6px; padding: 16px; margin: 20px 0; }
        .btn { padding: 10px 18px; border-radius: 4px; text-decoration: none; font-size: 0.95em; margin-right: 8px; border: none; cursor: pointer; }
        .btn-danger  { background: #e74c3c; color: white; }
        .btn-back    { background: #95a5a6; color: white; text-decoration: none; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 14px; color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <a href="/">👤 Usuarios</a>
        <a href="{% url 'transaccion_list' %}">💳 Transacciones</a>
    </nav>
    <h1>Eliminar Transacción</h1>
    <div class="warning-box">
        <p>¿Estás seguro que deseas eliminar esta transacción?</p>
        <p><strong>{{ objeto }}</strong></p>
        <p>Esta acción <strong>no se puede deshacer</strong>.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'transaccion_list' %}" class="btn btn-back">Cancelar</a>
    </form>
</body>
</html>
