<h1>Usuarios</h1>

<a href="{% url 'usuario_create' %}">Crear Usuario</a>

<ul>
  {% for usuario in usuarios %}
    <li>
      {{ usuario.nombre }}
      <a href="{% url 'usuario_detail' usuario.id %}">Ver</a>
      <a href="{% url 'usuario_update' usuario.id %}">Editar</a>
      <a href="{% url 'usuario_delete' usuario.id %}">Eliminar</a>
    </li>
  {% endfor %}
</ul>
